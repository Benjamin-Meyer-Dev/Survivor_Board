name: Deploy to Pages

# No build step - the repo root is the site. Every push to main redeploys,
# except the odds bot's own: GitHub triggers no workflow for a push made with
# GITHUB_TOKEN, so refresh-odds.yml asks for this one by workflow_dispatch
# after it commits. Which is also how to publish a data change by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
