name: Refresh odds

# Once a day at 9:00am Toronto time, and at no other time.
#
# There is no `schedule:` here on purpose. GitHub's cron is best effort, not a
# clock: a scheduled run is queued on shared capacity and released when there
# is room for it. On this repo that meant anywhere from 27 minutes to five
# hours late, most requested slots dropped outright, and on 14 September no
# morning run at all - which left Sunday's results off the board for a day. No
# arrangement of cron slots fixes that, because none of them is a clock.
#
# A workflow_dispatch IS honoured within seconds. So the clock lives outside
# GitHub - see scheduler/, a Cloudflare Worker whose cron fires at 9:00am
# Toronto and dispatches this workflow - and this file only decides whether the
# run it was handed is the day's 9am pull.
#
# The hour and timezone here must match scheduler/wrangler.toml and CONFIG
# .refresh in src/js/config.js, which is what the board counts down to.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Who asked for this run"
        type: choice
        options:
          # A human, from the Actions tab. Skips the window check: testing is
          # the whole point of the button, and it is no use at 2pm if it does
          # not run at 2pm. Costs the same 8 credits as the daily pull.
          - manual
          # The Worker's 9am cron. Held to the window check below.
          - scheduled
        default: manual

permissions:
  contents: write
  issues: write
  # To ask pages.yml to run. A push made with GITHUB_TOKEN triggers no
  # workflow, so the deploy has to be requested rather than fallen into.
  actions: write

# Never two at once. A retry from the Worker queues here and then falls out at
# the window check, which reads the timestamp the first one committed.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Ahead of the window check, because what that check reads is the last
      # pull's timestamp under data/. A checkout is a second or two and spends
      # no quota, which is what a run that falls out has to be cheap in.
      - uses: actions/checkout@v7

      - name: Check the Toronto refresh window
        id: refresh-time
        env:
          TZ: America/Toronto
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$REASON" != "scheduled" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "$(date '+%F %H:%M') local, dispatched by hand. Pulling."
            exit 0
          fi

          # 9am or not at all. The Worker's cron is punctual to within seconds,
          # so the quarter hour is slack for a Cloudflare queue delay and
          # nothing else: a dispatch that arrives outside it is a misfire or a
          # retry, and the day is skipped rather than pulled at the wrong time.
          # Read as local time, so the hour holds across daylight saving.
          hour=$(date +%-H)
          minute=$(date +%-M)
          if [ "$hour" -ne 9 ] || [ "$minute" -ge 15 ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "$(date '+%H:%M') local is outside the 9:00-9:14 window. Skipping the day."
            exit 0
          fi

          # One pull a day, decided by the local calendar day. Belt and braces
          # next to a single daily dispatch, and what makes a Worker retry
          # free: a second dispatch inside the same window finds the day done.
          today=$(date +%F)
          last=""
          for file in data/*/odds.json; do
            stamp=$(jq -r '.updatedAt // empty' "$file")
            [ -n "$stamp" ] || continue
            day=$(date -d "$stamp" +%F)
            if [ -z "$last" ] || [ "$day" \> "$last" ]; then last=$day; fi
          done

          if [ "$last" = "$today" ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Today's pull has already happened. Nothing to do."
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "$(date +%H:%M) local, last pull ${last:-never}. Pulling."
          fi

      - uses: actions/setup-node@v7
        if: steps.refresh-time.outputs.due == 'true'
        with:
          node-version: "24"

      - name: Fetch current lines
        if: steps.refresh-time.outputs.due == 'true'
        id: refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional. A free key from collegefootballdata.com turns on the
          # college efficiency layer (data/cfb/stats.json); without it the fit
          # runs on lines and margins alone and the log says so.
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # A duplicate guard, not the daily gate: the window check above is
          # what makes this once a day. Twenty minutes collapses a Worker retry
          # that lands inside the same window. Manual runs keep the script's own
          # short default, which is what makes testing from the Actions tab
          # possible.
          MIN_REFRESH_GAP_MS: ${{ inputs.reason == 'scheduled' && 1200000 || '' }}
        run: node scripts/refresh-odds.mjs

      - name: Commit if the numbers moved
        if: steps.refresh-time.outputs.due == 'true'
        id: commit
        run: |
          # Anything the bot owns under data/: odds.json, form.json,
          # stats.json and the day's snapshot, which is a new file every run.
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No line movement."
            exit 0
          fi
          git config user.name  "sudden-death[bot]"
          git config user.email "sudden-death[bot]@users.noreply.github.com"
          # All of the bot's files: odds.json is the pull, form.json the
          # ratings fitted to it, stats.json the efficiency numbers and
          # snapshots/ the day's lines, and the board needs them to agree.
          # Staged as a directory rather than by name so a league whose
          # optional files do not exist yet cannot fail the step on an
          # unmatched glob - the checkout is pristine, so nothing a human owns
          # can be dirty here.
          git add -A -- data
          git commit -m "chore(odds): refresh week ${{ steps.refresh.outputs.currentWeek || 'lines' }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GitHub does not trigger `on: push` for a push made with GITHUB_TOKEN,
      # which is a loop guard and not something a workflow can opt out of. So
      # the bot's own commit never redeployed the site: the new lines and
      # results sat on main while the board went on serving the previous day's
      # odds.json, which is a data pipeline that looks healthy from every side
      # except the only one that matters. A workflow_dispatch IS honoured with
      # that token, so the deploy is asked for by name.
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pages.yml",
              ref: context.ref.replace("refs/heads/", ""),
            });
            core.info("Asked pages.yml to redeploy.");

      - name: Open an issue when a pick is in danger
        if: steps.refresh-time.outputs.due == 'true' && steps.refresh.outputs.flagged != '' && steps.refresh.outputs.flagged != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const summary = `${{ steps.refresh.outputs.summary }}`;
            const title = `Pick flagged: line moved under threshold`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pick-flag',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: summary,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${summary}\n\nSwap to a backup on the board, or re-plan the remaining weeks.`,
                labels: ['pick-flag'],
              });
            }
