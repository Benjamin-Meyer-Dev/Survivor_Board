name: Refresh odds

# Once a day at 9am Toronto time. GitHub cron is UTC-only, so both possible UTC
# hours are scheduled and the first step keeps only the one that lands in the
# 9am local hour. That preserves the clock time across daylight-saving changes.
# The local time and timezone must match CONFIG.refresh in src/js/config.js.
on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  # Run it by hand from the Actions tab to test. schedule and workflow_dispatch
  # are independent triggers, so a manual run never moves the next daily one.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never two at once. Queued duplicates fall out at the freshness check inside
# scripts/refresh-odds.mjs rather than re-pulling the same lines.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Toronto refresh window
        id: refresh-time
        env:
          TZ: America/Toronto
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$(date +%H)" = "09" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the alternate UTC slot."
          fi

      - uses: actions/checkout@v7
        if: steps.refresh-time.outputs.due == 'true'

      - uses: actions/setup-node@v7
        if: steps.refresh-time.outputs.due == 'true'
        with:
          node-version: "24"

      - name: Fetch current lines
        if: steps.refresh-time.outputs.due == 'true'
        id: refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/refresh-odds.mjs

      - name: Commit if the numbers moved
        if: steps.refresh-time.outputs.due == 'true'
        id: commit
        run: |
          if git diff --quiet -- 'data/*/odds.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No line movement."
            exit 0
          fi
          git config user.name  "survivor-board[bot]"
          git config user.email "survivor-board[bot]@users.noreply.github.com"
          git add data/*/odds.json
          git commit -m "chore(odds): refresh week ${{ steps.refresh.outputs.currentWeek || 'lines' }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open an issue when a pick is in danger
        if: steps.refresh-time.outputs.due == 'true' && steps.refresh.outputs.flagged != '' && steps.refresh.outputs.flagged != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const summary = `${{ steps.refresh.outputs.summary }}`;
            const title = `Pick flagged: line moved under threshold`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pick-flag',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: summary,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${summary}\n\nSwap to a backup on the board, or re-plan the remaining weeks.`,
                labels: ['pick-flag'],
              });
            }
