name: Refresh odds

# Once a day at 14:00 UTC, 10am Eastern in September. That is the free Odds API
# quota talking: a run costs 4 credits per league (2 for lines, 2 for scores),
# so two leagues daily is about 250 of the 500 a month. GitHub queues scheduled
# runs on shared capacity, so the fire time drifts by a few minutes.
# The hour must match refresh.hourUtc in src/js/config.js.
on:
  schedule:
    - cron: "0 14 * * *"
  # Run it by hand from the Actions tab to test. schedule and workflow_dispatch
  # are independent triggers, so a manual run never moves the next daily one.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never two at once. Queued duplicates fall out at the freshness check inside
# scripts/refresh-odds.mjs rather than re-pulling the same lines.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch current lines
        id: refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/refresh-odds.mjs

      - name: Commit if the numbers moved
        id: commit
        run: |
          if git diff --quiet -- 'data/*/odds.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No line movement."
            exit 0
          fi
          git config user.name  "survivor-board[bot]"
          git config user.email "survivor-board[bot]@users.noreply.github.com"
          git add data/*/odds.json
          git commit -m "chore(odds): refresh week ${{ steps.refresh.outputs.currentWeek || 'lines' }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open an issue when a pick is in danger
        if: steps.refresh.outputs.flagged != '' && steps.refresh.outputs.flagged != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const summary = `${{ steps.refresh.outputs.summary }}`;
            const title = `Pick flagged: line moved under threshold`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pick-flag',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: summary,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${summary}\n\nSwap to a backup on the board, or re-plan the remaining weeks.`,
                labels: ['pick-flag'],
              });
            }
