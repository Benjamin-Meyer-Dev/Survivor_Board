name: Refresh odds

# Once a day at 9am Toronto time. GitHub cron is UTC-only, so both possible UTC
# hours are scheduled and the first step drops the one that lands before the
# local 9am. That preserves the clock time across daylight-saving changes.
# The local time and timezone must match CONFIG.refresh in src/js/config.js.
#
# Off the top of the hour on purpose: GitHub queues every cron in the world at
# :00 and sheds load from it, and a dropped slot here is a day with no results.
on:
  schedule:
    - cron: "17 13 * * *"
    - cron: "17 14 * * *"
  # Run it by hand from the Actions tab to test. schedule and workflow_dispatch
  # are independent triggers, so a manual run never moves the next daily one.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # To ask pages.yml to run. A push made with GITHUB_TOKEN triggers no
  # workflow, so the deploy has to be requested rather than fallen into.
  actions: write

# Never two at once. The second slot of the day, and any duplicate behind it,
# falls out at the freshness check inside scripts/refresh-odds.mjs rather than
# re-pulling the same lines: MIN_REFRESH_GAP_MS below is what makes that check
# the once-a-day guard, so the time gate does not have to be exact.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Toronto refresh window
        id: refresh-time
        env:
          TZ: America/Toronto
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # From 9am local onward, not the 9am hour exactly. GitHub's cron runs
          # late under load - sometimes by hours - and a run that lands at 11 is
          # still the day's run, so pinning it to one hour turned a delay into a
          # day with no lines and no results. Anything earlier is the alternate
          # UTC slot on the other side of daylight saving and is genuinely not
          # due; anything later is deduplicated by the freshness check in
          # scripts/refresh-odds.mjs, which costs no API quota.
          if [ "$(date +%-H)" -ge 9 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "$(date +%H:%M) local is before the 9am refresh: alternate UTC slot."
          fi

      - uses: actions/checkout@v7
        if: steps.refresh-time.outputs.due == 'true'

      - uses: actions/setup-node@v7
        if: steps.refresh-time.outputs.due == 'true'
        with:
          node-version: "24"

      - name: Fetch current lines
        if: steps.refresh-time.outputs.due == 'true'
        id: refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Twenty hours, so the day's two scheduled slots collapse into one
          # pull while a genuine next-day run always goes through. Manual runs
          # keep the script's own short default, which is what makes testing
          # from the Actions tab possible.
          MIN_REFRESH_GAP_MS: ${{ github.event_name == 'schedule' && 72000000 || '' }}
        run: node scripts/refresh-odds.mjs

      - name: Commit if the numbers moved
        if: steps.refresh-time.outputs.due == 'true'
        id: commit
        run: |
          if git diff --quiet -- 'data/*/odds.json' 'data/*/form.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No line movement."
            exit 0
          fi
          git config user.name  "survivor-board[bot]"
          git config user.email "survivor-board[bot]@users.noreply.github.com"
          # Both of the bot's files: odds.json is the pull, form.json is the
          # ratings fitted to it, and the board needs the pair to agree. Staged
          # as a directory rather than by name so a league whose form.json does
          # not exist yet cannot fail the step on an unmatched glob - the
          # checkout is pristine, so nothing a human owns can be dirty here.
          git add -A -- data
          git commit -m "chore(odds): refresh week ${{ steps.refresh.outputs.currentWeek || 'lines' }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GitHub does not trigger `on: push` for a push made with GITHUB_TOKEN,
      # which is a loop guard and not something a workflow can opt out of. So
      # the bot's own commit never redeployed the site: the new lines and
      # results sat on main while the board went on serving the previous day's
      # odds.json, which is a data pipeline that looks healthy from every side
      # except the only one that matters. A workflow_dispatch IS honoured with
      # that token, so the deploy is asked for by name.
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pages.yml",
              ref: context.ref.replace("refs/heads/", ""),
            });
            core.info("Asked pages.yml to redeploy.");

      - name: Open an issue when a pick is in danger
        if: steps.refresh-time.outputs.due == 'true' && steps.refresh.outputs.flagged != '' && steps.refresh.outputs.flagged != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const summary = `${{ steps.refresh.outputs.summary }}`;
            const title = `Pick flagged: line moved under threshold`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pick-flag',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: summary,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${summary}\n\nSwap to a backup on the board, or re-plan the remaining weeks.`,
                labels: ['pick-flag'],
              });
            }
