<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chalk</title>
    <meta
      name="description"
      content="Shared college and NFL survivor pool tracker with market lines, backups and a burn board."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f4d2c" />

    <!-- Installable to a phone home screen. Chrome needs the manifest's 192
         and 512 icons plus the service worker registered in app.js before it
         will offer Install; iOS reads the apple-* tags instead. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chalk" />

    <!-- Fetched with CORS so the service worker can keep a real copy and open
         from it next time; without the attribute the response is opaque. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      crossorigin
    />

    <link rel="stylesheet" href="./src/css/tokens.css" />
    <link rel="stylesheet" href="./src/css/base.css" />
    <link rel="stylesheet" href="./src/css/layout.css" />
    <link rel="stylesheet" href="./src/css/components.css" />
    <link rel="stylesheet" href="./src/css/field.css" />
    <link rel="stylesheet" href="./src/css/leagues.css" />
    <link rel="stylesheet" href="./src/css/motion.css" />
  </head>

  <body class="is-starting">
    <!-- Present in the document from the first paint, so returning devices get
         an intentional startup screen while app.js loads the board. -->
    <div class="startup" id="startup" role="status" aria-live="polite">
      <div class="startup__scene" aria-hidden="true">
        <span class="startup__yard startup__yard--left">20</span>
        <span class="startup__yard startup__yard--right">40</span>
        <span class="startup__ball">
          <svg viewBox="0 0 54 34">
            <path d="M3 17C9 4 20 1 27 1s18 3 24 16c-6 13-17 16-24 16S9 30 3 17Z" />
            <path d="M15 17h24M19 14v6M23 14v6M27 14v6M31 14v6M35 14v6" />
          </svg>
        </span>
        <span class="startup__route"></span>
      </div>
      <p class="startup__brand">Chalk</p>
      <p class="startup__status" id="startup-status">Chalking up the field…</p>
    </div>

    <!-- Start screen: the name, once per device. app.js fills it and clears it. -->
    <div class="gate" id="start" hidden></div>

    <main class="shell">
      <!-- Banners: a message from app.js, the storage mode, a rule break. Shown
           above whichever screen is up. -->
      <div class="notices" id="notices"></div>

      <!-- The home page: this device's leagues, and where they are made,
           joined and shared. app.js shows one of the two screens at a time. -->
      <div id="home" hidden></div>
      <!-- The home page's two sheets, built once and kept outside the list
           above, which is redrawn as leagues arrive. -->
      <div id="home-sheets"></div>

      <!-- The board: a split screen held in one hand. The readout at the top
           is the field, the drive line and the week's call; the drawer below
           is what you touch. -->
      <div class="board" id="board">
        <!-- The topline: the way back, the league and its pool (ui/league-bar.js),
             and the gear for the pool's rules (ui/settings.js). -->
        <header class="topline" id="league-bar">
          <div class="topline__league" id="league"></div>
          <div class="topline__gear" id="settings"></div>
        </header>

        <section class="readout" aria-label="The field">
          <!-- The season as the field, and the drive line under it (ui/pitch.js). -->
          <div id="pitch"></div>
          <!-- The week being looked at, and the one action at the seam (ui/call.js). -->
          <div id="call"></div>
        </section>

        <section class="drawer" id="drawer" aria-label="The drawer">
          <div class="drawer__tabs" role="tablist" aria-label="Drawer panels" id="tabs"></div>

          <div class="drawer__panels" id="views">
            <section
              class="drawer__panel"
              id="view-week"
              role="tabpanel"
              aria-labelledby="tab-week"
              tabindex="0"
            >
              <!-- Every team the slot could hold this week (ui/sideline.js). -->
              <div id="sideline"></div>
            </section>

            <section
              class="drawer__panel"
              id="view-path"
              role="tabpanel"
              aria-labelledby="tab-path"
              tabindex="0"
              hidden
            >
              <!-- The season, week by week (ui/drive.js). -->
              <div id="drive"></div>
            </section>

            <section
              class="drawer__panel"
              id="view-burn"
              role="tabpanel"
              aria-labelledby="tab-burn"
              tabindex="0"
              hidden
            >
              <!-- Every eligible team, and where it sits on the path (ui/bench.js). -->
              <div id="bench"></div>
              <footer class="legend" id="bench-legend"></footer>
            </section>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
